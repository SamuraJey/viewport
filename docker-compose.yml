x-celery-base: &celery-base
  build:
    context: .
    dockerfile: Dockerfile.backend
  restart: always
  env_file:
    - .env.prod
  depends_on:
    - redis
    - postgres
    - s3-service
  networks:
    - backend
  environment: &celery-s3-env
    S3_ENDPOINT: http://s3-service:9000
    S3_USE_SSL: "false"
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin
    S3_BUCKET: viewport
    REDIS_URL: redis://redis:6379/1
  volumes: &celery-src-volumes
    - ./src:/app/src
    - ./config:/app/config

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: viewport_app
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - s3-service
      - redis
    networks:
      - backend
    environment:
      - S3_ENDPOINT=http://s3-service:9000
      - S3_USE_SSL=false
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=viewport
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  postgres:
    image: postgres:17-alpine
    container_name: viewport_postgres
    restart: always
    environment:
      POSTGRES_DB: viewport
      POSTGRES_USER: viewport
      POSTGRES_PASSWORD: viewport
      POSTGRES_MAX_CONNECTIONS: 1000
    command: postgres -c max_connections=1000 -c shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  s3-service:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: viewport_s3
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN: some_secure_token
      RUSTFS_NOTIFY_WEBHOOK_ENABLE: true
      RUSTFS_BUFFER_PROFILE: AiTraining
      RUSTFS_NS_SCANNER_INTERVAL: 60
      RUST_LOG: "rustfs=info,ecstore=info,s3s=info,iam=info,notify=info"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.50"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  redis:
    image: valkey/valkey:9-alpine
    container_name: viewport_redis
    restart: always
    command: >
      valkey-server
      --maxclients 1000
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    ports:
      - "6379:6379"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 32M

  celery_worker:
    <<: *celery-base
    container_name: viewport_celery_worker
    command: celery -A src.viewport.celery_app worker --loglevel=info --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=50 --max-memory-per-child=160000 --beat
    environment:
      <<: *celery-s3-env
      MALLOC_ARENA_MAX: "1"
      MALLOC_TRIM_THRESHOLD_: "131072"
      VIPS_CONCURRENCY: "1"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 768M
        reservations:
          cpus: "0.50"
          memory: 256M

  celery_video_worker:
    <<: *celery-base
    container_name: viewport_celery_video_worker
    command: celery -A src.viewport.celery_app worker -Q video --loglevel=info --concurrency=1 --max-tasks-per-child=50 --pool=prefork
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - video_tmp:/tmp/video_processing
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
  s3_data:
  video_tmp:

networks:
  backend:
    driver: bridge
