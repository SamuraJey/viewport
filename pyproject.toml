[project]
name = "viewport"
version = "0.1.0"
description = "Portal for sharing photos with friends!"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "alembic==1.20.*",
    "bcrypt==5.0.*",
    # aioboto3 / aiobotocore constrain the AWS SDK; keep stubs on the same minor.
    "boto3==1.40.*",
    "botocore==1.40.*",
    "Pillow==12.3.*",
    "fastapi==0.143.*",
    "starlette==1.7.*",
    "prometheus-fastapi-instrumentator==8.1.*",
    "pydantic-settings==2.15.*",
    "pydantic[email]==2.14.*",
    "pyvips==3.2.*",
    "pyjwt==2.15.*",
    "python-multipart==0.0.*",
    "aiohttp==3.14.*",
    "redis==8.1.*",
    "sqladmin[full]==0.32.*",
    "sqlalchemy[asyncio]==2.1.*",
    "uvicorn==0.54.*",
    "psycopg[binary]==3.3.*",
    "aioboto3==15.5.*",
    "zipstream-ng==1.9.*",
    "uvloop==0.23.*",
    "celery==5.6.*"
]

[dependency-groups]
dev = [
    "mypy==2.4.*",
    "ruff==0.17.*",
    "pre-commit==4.6.*",
    "pytest==9.1.*",
    "pytest-cov==7.1.*",
    "pytest-xdist==3.8.*",
    "pytest-mock==3.16.*",
    "pytest-asyncio==1.4.*",
    "pytest-freezer==0.4.*",
    "pytest-random-order==1.2.*",
    "testcontainers==4.15.*",
    "boto3-stubs[s3]==1.40.*",
    "uv==0.13.*",
    "pip==26.2.*",
    "freezegun==1.5.*",
    "httpx2==2.13.*", # required by starlette.testclient
]

[build-system]
requires = ["uv_build==0.13.*"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
plugins = "pydantic.mypy"
exclude = ["postgres_data", "conftest.py", "src/viewport/alembic/.*", "tests/.*"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
warn_unreachable = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "./postgres_data",
    "./src/viewport/alembic"
]

line-length = 200
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
# E - pycodestyle F - Pyflakes UP - pyupgrade B - flake8-bugbear SIM - flake8-simplify I - isort
# N - flake8-annotations A - flake8-annotations T20 - flake8-tidy-imports ERA - flake8-eradicate
# C4 - flake8-comprehensions TID - flake8-tidy-imports PERF - flake8-perf, G - flake8-logging-format
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "N",
    "A",
    "T20",
    "ERA",
    "C4",
    "TID",
    "PERF",
    "G"
]
ignore = ["SIM108", "E712", "C416", "UP037"]
flake8-bugbear.extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore E501 (line too long) in tests.
"tests/*" = ["E501", "N803"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib", "-v"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_s3: tests that need real S3 object storage operations"
]
norecursedirs = [
    "postgres_data",
    ".git",
    ".venv",
    "__pycache__",
    "static",
    "templates",
    "logs"
]
filterwarnings = [
    # Ignore testcontainers deprecation warning about @wait_container_is_ready decorator
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
    # Ignore datetime.utcnow() deprecation warnings
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning"
]

[tool.coverage.run]
# Needed by py-cov-action/python-coverage-comment-action to map paths correctly
relative_files = true
omit = ["*/alembic/*"]
