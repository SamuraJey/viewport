[project]
name = "viewport"
version = "0.1.0"
description = "Portal for sharing photos with friends!"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "alembic>=1.20,<2.0",
    "bcrypt>=5.0,<6.0",
    "boto3>=1.39.9,<1.42",
    "botocore>=1.39.9,<1.42",
    "Pillow>=12.3,<13.0",
    "fastapi>=0.143,<1.0",
    "starlette>=1.7,<2.0",
    "prometheus-fastapi-instrumentator>=8.1,<9.0",
    "pydantic-settings>=2.15,<3.0",
    "pydantic[email]>=2.14,<3.0",
    "pyvips>=3.2,<4.0",
    "pyjwt>=2.15,<3.0",
    "python-multipart>=0.0,<1.0",
    "aiohttp>=3.14.1",
    "redis>=8.1,<9.0",
    "sqladmin[full]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.1,<3.0",
    "uvicorn>=0.54,<1.0",
    "psycopg[binary]>=3.3,<4.0",
    "aioboto3>=15.1.0,<16.0.0",
    "zipstream-ng>=1.9,<2.0",
    "uvloop>=0.23,<1.0",
    "celery>=5.6,<6.0"
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3.0",
    "ruff>=0.17,<1.0",
    "pre-commit>=4.6,<5.0",
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-xdist>=3.8,<4.0",
    "pytest-mock>=3.16,<4.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-freezer>=0.4,<1.0",
    "pytest-random-order>=1.2,<2.0",
    "testcontainers>=4.15,<5.0",
    "boto3-stubs[s3]>=1.39.9,<1.42",
    "uv>=0.13,<1.0",
    "pip>=26.2,<27.0",
    "freezegun>=1.5,<2.0",
    "httpx2>=2.13,<3.0", # required by starlette.testclient
]

[build-system]
requires = ["uv_build>=0.13,<1.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
plugins = "pydantic.mypy"
exclude = ["postgres_data", "conftest.py", "src/viewport/alembic/.*", "tests/.*"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
warn_unreachable = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "./postgres_data",
    "./src/viewport/alembic"
]

line-length = 200
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
# E - pycodestyle F - Pyflakes UP - pyupgrade B - flake8-bugbear SIM - flake8-simplify I - isort
# N - flake8-annotations A - flake8-annotations T20 - flake8-tidy-imports ERA - flake8-eradicate
# C4 - flake8-comprehensions TID - flake8-tidy-imports PERF - flake8-perf, G - flake8-logging-format
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "N",
    "A",
    "T20",
    "ERA",
    "C4",
    "TID",
    "PERF",
    "G"
]
ignore = ["SIM108", "E712", "C416", "UP037"]
flake8-bugbear.extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore E501 (line too long) in tests.
"tests/*" = ["E501", "N803"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = "."
addopts = ["--import-mode=importlib", "-v"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_s3: tests that need real S3 object storage operations"
]
norecursedirs = [
    "postgres_data",
    ".git",
    ".venv",
    "__pycache__",
    "static",
    "templates",
    "logs"
]
filterwarnings = [
    # Ignore testcontainers deprecation warning about @wait_container_is_ready decorator
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
    # Ignore datetime.utcnow() deprecation warnings
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning"
]

[tool.coverage.run]
# Needed by py-cov-action/python-coverage-comment-action to map paths correctly
relative_files = true
omit = ["*/alembic/*"]
