name: CI

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'src/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.backend'
              - 'Justfile'
              - 'docker-compose*.yml'
              - 'config/**'
            frontend:
              - '.dockerignore'
              - 'frontend/**'
              - 'Dockerfile.frontend'

  build-backend-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore uv package cache for Docker
        uses: actions/cache@v4
        with:
          path: .uv-docker-cache
          key: ${{ runner.os }}-docker-uv-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-uv-cache-

      - name: Inject uv cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .uv-docker-cache
          cache-target: /root/.cache/uv

      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend
          target: runtime
          push: false
          github-token: ${{ github.token }}
          cache-from: type=gha,scope=backend-image,ignore-error=true
          cache-to: type=gha,mode=max,scope=backend-image,ignore-error=true
  python-tests:
    name: Python Tests in Docker (coverage >= 75%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    permissions:
      # Required for posting/updating PR comments and pushing the data branch on default branch
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore uv package cache for test image
        uses: actions/cache@v4
        with:
          path: .uv-docker-test-cache
          key: ${{ runner.os }}-docker-uv-test-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-uv-test-cache-

      - name: Inject uv cache into test build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .uv-docker-test-cache
          cache-target: /root/.cache/uv

      - name: Build test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend
          target: test
          tags: viewport/backend-test:ci
          load: true
          push: false
          github-token: ${{ github.token }}
          cache-from: |
            type=gha,scope=backend-tests,ignore-error=true
            type=gha,scope=backend-image,ignore-error=true
          cache-to: type=gha,mode=max,scope=backend-tests,ignore-error=true

      - name: Run tests with coverage
        id: tests
        run: |
          mkdir -p .ci-reports
          docker run --rm --network host \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.ci-reports,target=/reports" \
            -e CI=true -e JWT_SECRET_KEY=supersecretkey \
            -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            -e TESTCONTAINERS_CONNECTION_MODE=docker_host \
            -e COVERAGE_FILE=/reports/.coverage \
            viewport/backend-test:ci \
            pytest -n auto --cov=src --cov-branch --cov-report=xml:/reports/coverage.xml \
            --cov-fail-under=75 --random-order-bucket=module --random-order-seed=$RANDOM tests/

      - name: Collect coverage from container
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" .ci-reports
          for report in .coverage coverage.xml; do
            if [ -f ".ci-reports/$report" ]; then
              cp ".ci-reports/$report" "$report"
            fi
          done

      - name: Comment coverage on PR (non-blocking)
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

  frontend-build-and-tests:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and build
        working-directory: frontend
        env:
          VITE_API_URL: https://backend.example.test
        run: npm run build
      - name: Run unit tests (vitest)
        working-directory: frontend
        run: npm run test:run -- --reporter=dot

  frontend-security-audit:
    name: Frontend Security Audit (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level moderate
