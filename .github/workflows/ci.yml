name: CI

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.backend'
              - 'Dockerfile.backend.test'
              - 'Justfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Dockerfile.frontend'
              - 'Dockerfile.frontend.test'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  backend-container-tests:
    name: Backend Container Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore uv package cache for Docker
        uses: actions/cache@v5.0.3
        with:
          path: .uv-docker-cache
          key: ${{ runner.os }}-docker-uv-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-uv-cache-

      - name: Inject uv cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .uv-docker-cache
          cache-target: /root/.cache/uv

      - name: Build backend test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend.test
          push: false
          load: true
          tags: viewport/backend-test:${{ github.sha }}
          cache-from: type=gha,scope=backend-test,ignore-error=true
          cache-to: type=gha,mode=max,scope=backend-test,ignore-error=true

      - name: Run tests in the built image
        env:
          TEST_IMAGE: viewport/backend-test:${{ github.sha }}
        run: |
          mkdir -p test-results
          docker run --rm \
            --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/test-results:/test-results" \
            --env CI=true \
            --env TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock \
            --env TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            "$TEST_IMAGE" \
            pytest -n 4 tests \
              --cov=viewport \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml:/test-results/coverage.xml \
              --cov-fail-under=85 \
              --random-order-bucket=module \
              --random-order-seed="$RANDOM"
          cp test-results/coverage.xml coverage.xml

  backend-runtime-image:
    name: Backend Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, backend-container-tests]
    if: ${{ needs.detect-changes.outputs.backend == 'true' && needs.backend-container-tests.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore uv package cache for Docker
        uses: actions/cache@v5.0.3
        with:
          path: .uv-docker-cache
          key: ${{ runner.os }}-docker-uv-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-uv-cache-

      - name: Inject uv cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .uv-docker-cache
          cache-target: /root/.cache/uv

      - name: Build backend production image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend
          target: runtime
          push: false
          load: true
          tags: viewport/backend:${{ github.sha }}
          cache-from: |
            type=gha,scope=backend-runtime,ignore-error=true
            type=gha,scope=backend-test,ignore-error=true
          cache-to: type=gha,mode=max,scope=backend-runtime,ignore-error=true

  frontend-container-tests:
    name: Frontend Container Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore npm package cache for Docker
        uses: actions/cache@v5.0.3
        with:
          path: .npm-docker-cache
          key: ${{ runner.os }}-docker-npm-cache-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-docker-npm-cache-

      - name: Inject npm cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .npm-docker-cache
          cache-target: /root/.npm

      - name: Build frontend test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.frontend.test
          push: false
          load: true
          tags: viewport/frontend-test:${{ github.sha }}
          cache-from: type=gha,scope=frontend-test,ignore-error=true
          cache-to: type=gha,mode=max,scope=frontend-test,ignore-error=true

      - name: Run lint and tests in the built image
        env:
          TEST_IMAGE: viewport/frontend-test:${{ github.sha }}
        run: |
          docker run --rm "$TEST_IMAGE" npm run lint
          docker run --rm "$TEST_IMAGE" npm run test:run -- --reporter=dot

  frontend-runtime-image:
    name: Frontend Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, frontend-container-tests]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' && needs.frontend-container-tests.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Restore npm package cache for Docker
        uses: actions/cache@v5.0.3
        with:
          path: .npm-docker-cache
          key: ${{ runner.os }}-docker-npm-cache-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-docker-npm-cache-

      - name: Inject npm cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: .npm-docker-cache
          cache-target: /root/.npm

      - name: Build frontend production image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.frontend
          target: runtime
          build-args: VITE_API_URL=https://backend.example.test
          push: false
          load: true
          tags: viewport/frontend:${{ github.sha }}
          cache-from: |
            type=gha,scope=frontend-runtime,ignore-error=true
            type=gha,scope=frontend-test,ignore-error=true
          cache-to: type=gha,mode=max,scope=frontend-runtime,ignore-error=true

  frontend-security-audit:
    name: Frontend Security Audit (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level moderate
