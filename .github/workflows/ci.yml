name: CI

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.backend'
              - 'Justfile'
              - 'docker-compose*.yml'
              - 'config/**'
            frontend:
              - 'frontend/**'
              - 'Dockerfile.frontend'

  build-backend-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

  python-tests:
    name: Python Tests (with coverage >= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    permissions:
      # Required for posting/updating PR comments and pushing the data branch on default branch
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ""
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: python-tests

      - name: Set Up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        env:
          JWT_SECRET_KEY: supersecretkey
          CI: true
        run: |
          uv run pytest -n auto --cov=src --cov-branch --cov-report=xml --cov-fail-under=75 --random-order-bucket=module --random-order-seed=$RANDOM tests/

      - name: Comment coverage on PR (non-blocking)
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

  frontend-build-and-tests:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and build
        working-directory: frontend
        env:
          VITE_API_URL: https://backend.example.test
        run: npm run build
      - name: Run unit tests (vitest)
        working-directory: frontend
        run: npm run test:run -- --reporter=dot

  frontend-security-audit:
    name: Frontend Security Audit (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level moderate
